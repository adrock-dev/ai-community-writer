# Adrock 콘텐츠 운영 서버 — NestJS API(+워커)와 DB 볼륨.
#
#   docker compose up --build
#
# 생성(LLM)을 쓰려면 호스트의 claude/codex 인증을 마운트해야 한다(아래 volumes 주석 해제).

services:
  api:
    build: .
    image: adrock-api-nest:latest
    env_file: [.env]
    environment:
      SEO_DB_PATH: /data/admin.db
      # 조사 DB 도 볼륨에 둔다. 비워 두면 컨테이너 내부(/app/data)에 생겨 컨테이너를 다시 만들 때
      # 사라지는데, AI 심층조사값·검증완료 승인은 원천에서 다시 받을 수 없다(재조사 4~5시간+LLM 비용).
      # ${...:-} 형태라 .env 에서 다른 경로를 지정했으면 그 값이 이긴다.
      ACADEMY_RESEARCH_DB_PATH: ${ACADEMY_RESEARCH_DB_PATH:-/data/academy_research.db}
      ADMIN_HOST: 0.0.0.0
      API_WORKER: "1"
    ports:
      - "${ADMIN_PORT:-8765}:8765"
    volumes:
      - adrock-db:/data
      # 생성용 인증(필요 시 주석 해제):
      # - ${HOME}/.claude:/root/.claude:ro
      # - ${HOME}/.codex:/root/.codex:ro
    restart: unless-stopped

volumes:
  adrock-db:
